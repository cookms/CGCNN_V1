[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-gnn"
version = "0.4.2"
description = "Research-oriented crystal graph neural networks for materials property prediction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Materials GNN Research"}
]
dependencies = [
    "torch>=2.0",
    "pymatgen>=2023.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["materials_gnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
